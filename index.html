  <header class="site-header">

      <p class="eyebrow">Servicio de Salud</p>
      <h1>Organigrama institucional</h1>
      <p class="intro">Pulsa cualquier sección para consultar a la persona responsable.</p>
    </div>
    <div class="accessibility" role="group" aria-label="Controles de lectura">
      <span class="accessibility-label">Tamaño de texto</span>
      <button type="button" data-font="decrease" aria-label="Reducir tamaño de texto">A−</button>
      <button type="button" data-font="reset" aria-label="Restablecer tamaño de texto">A</button>
      <button type="button" data-font="increase" aria-label="Aumentar tamaño de texto">A+</button>
    </div>
  </header>

  <main>
    <section class="legend" aria-label="Ayuda de navegación">
      <span><i class="legend-dot"></i> Pulsa un cargo para ver sus datos</span>
      <span><i class="legend-line"></i> Línea jerárquica</span>
    </section>
    <section id="org-chart" class="org-chart" aria-label="Organigrama interactivo"></section>
  </main>

  <dialog id="person-dialog" class="person-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" type="button" aria-label="Cerrar ficha">×</button>
    <div class="person-card">
      <div class="person-photo-wrap"><img id="dialog-photo" class="person-photo" alt=""></div>
      <div class="person-copy">
        <p class="eyebrow">Responsable</p>
        <h2 id="dialog-title"></h2>
        <p id="dialog-role" class="person-role"></p>
        <p id="dialog-name" class="person-name"></p>
        <p id="dialog-note" class="person-note"></p>
      </div>
    </div>
  </dialog>
